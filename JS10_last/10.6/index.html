<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления студентами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        th { cursor: pointer; user-select: none; }
        th:hover { background-color: #f8f9fa; color: #0d6efd; }
    </style>
</head>
<body class="bg-light py-5">
    <div class="container">
        <h2 class="mb-3">Добавить студента</h2>
        <form id="add-student-form" class="row g-3 mb-5 p-4 bg-white shadow-sm rounded">
            <div class="col-md-4">
                <input type="text" id="input-surname" class="form-control" placeholder="Фамилия" required>
            </div>
            <div class="col-md-4">
                <input type="text" id="input-name" class="form-control" placeholder="Имя" required>
            </div>
            <div class="col-md-4">
                <input type="text" id="input-lastname" class="form-control" placeholder="Отчество" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Дата рождения</label>
                <input type="date" id="input-birth" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Год начала обучения</label>
                <input type="number" id="input-start-year" class="form-control" placeholder="Напр. 2020" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Факультет</label>
                <input type="text" id="input-faculty" class="form-control" placeholder="Название факультета" required>
            </div>
            <div class="col-12">
                <div id="error-messages" class="text-danger mb-2"></div>
                <button type="submit" class="btn btn-primary">Добавить студента</button>
            </div>
        </form>

        <h2 class="mb-3">Фильтры</h2>
        <div class="row g-3 mb-4 p-3 bg-white shadow-sm rounded">
            <div class="col-md-3">
                <input type="text" id="filter-fio" class="form-control" placeholder="Поиск по ФИО">
            </div>
            <div class="col-md-3">
                <input type="text" id="filter-faculty" class="form-control" placeholder="Поиск по факультету">
            </div>
            <div class="col-md-3">
                <input type="number" id="filter-start" class="form-control" placeholder="Год начала">
            </div>
            <div class="col-md-3">
                <input type="number" id="filter-end" class="form-control" placeholder="Год окончания">
            </div>
        </div>

        <table class="table table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th id="sort-fio">Ф. И. О.</th>
                    <th id="sort-faculty">Факультет</th>
                    <th id="sort-birth">Дата рождения и возраст</th>
                    <th id="sort-start">Годы обучения</th>
                </tr>
            </thead>
            <tbody id="students-table-body"></tbody>
        </table>
    </div>
    <script src="main.js"></script>
</body>
</html>
